name: build-windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        shell: bash
        run: cargo build --release --features stealth,screenshot --target x86_64-pc-windows-msvc
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: aginxbrowser-windows-x64
          path: target/x86_64-pc-windows-msvc/release/aginxbrowser.exe
          if-no-files-found: error
